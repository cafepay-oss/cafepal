server {
    server_name s2.cafepay.app s2.cfpy.ir;
    client_max_body_size 10m;

    location ~ ^/(api|admin|ws) {
        proxy_pass http://core:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;

    }

    location ~ ^/(static|media) {
        root /;
    }


    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/s2.cafepay.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s2.cafepay.app/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name s2.cafepay.app;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}